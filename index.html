h1,h2,h3{margin:0 0 10px}h1{font-size:clamp(26px,5vw,42px);letter-spacing:1px}h2{font-size:21px}p{margin:7px 0}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select,.field textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}.hero-preview{max-width:210px;width:100%;margin:auto}.hero-preview svg{width:100%}.option{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:6px 0}.option.selected{border:2px solid var(--accent)}.phone{width:90px;display:inline-block;vertical-align:middle}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}.item:last-child{border:0}.tag{font-size:12px;padding:3px 7px;border-radius:7px;background:var(--bg);color:var(--muted)}.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:14px}.modal{background:var(--panel);color:var(--ink);width:min(650px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0006}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.log{padding:9px 0;border-bottom:1px solid var(--line)}.dice{font-size:48px;text-align:center;animation:roll .8s ease}.shake{animation:shake .35s}@keyframes roll{0%{transform:rotate(0) scale(.5)}50%{transform:rotate(380deg) scale(1.2)}100%{transform:rotate(720deg) scale(1)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;font-size:26px;animation:conf 1.3s forwards}@keyframes conf{to{transform:translateY(100vh) rotate(500deg);opacity:0}}.hidden{display:none!important}.ending{text-align:center}.ending svg{width:100%;max-height:290px}.progress{height:8px;border-radius:10px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
@media(max-width:650px){#app{padding:9px}.top{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 4px}.stat b{font-size:15px}.dialog{grid-template-columns:78px 1fr;gap:10px}.portrait{width:78px;height:100px}.choices{grid-template-columns:1fr}.bottom{grid-template-columns:repeat(3,1fr);position:static}.bottom button{padding:8px 3px}.panel{padding:12px}.custom{flex-direction:column}.grid2{grid-template-columns:1fr}}

 {id:"honest",name:"Честный путь",test:s=>s.rep>=85&&s.honesty>=85,text:"Твоя репутация стала главным активом. Крупная компания предлагает тебе работу и партнёрство. Ты не стал самым богатым человеком города. Зато можешь спокойно смотреть клиентам в глаза. Старые покупатели рекомендуют тебя новым. Гена гордится твоим выбором. Саня признаёт, что ты оказался прав. Иногда честная стратегия приносит результат медленнее. Но он держится дольше."},
 {id:"solo",name:"Успешный одиночка",test:s=>s.money>=100000&&s.risk<65,text:"Ты сохранил независимость и научился выбирать сделки. Большой сети не получилось, зато доход стабилен. Ты сам решаешь, когда работать и с кем сотрудничать. Клиенты знают твой номер. Поставщики уважают твою осторожность. Вечером ты закрываешь ноутбук без тревоги. Это не сказка о миллионах. Это история о человеке, который построил своё дело."},
 {id:"secret",name:"Король чёрного рынка",test:s=>s.gray>=4&&s.flags.stasControl&&s.flags.orlovNeutral&&s.flags.rustamNeutral,text:"Ты оказался в центре теневого рынка. Влияние росло быстрее, чем безопасность. Люди боялись спорить с тобой, но почти никто не доверял. Городские связи стали твоей главной валютой. Одна ошибка могла разрушить всё. Эта победа не похожа на обычный успех. За ней тянется длинная цепочка последствий. И покоя в ней немного."}

function customAction(){let v=$("customAction").value.trim().toLowerCase();if(!v)return;let response="Ты формулируешь мысль, но ситуация не меняется от красивых слов. Лучше выбрать конкретное действие.";if(/привет|здравств|добрый/.test(v))response="Ты начинаешь вежливо. Собеседник немного расслабляется.";else if(/скид|дешев|торг/.test(v)){let r=check("Торг",12);if(r==="success"){state.money+=700;response="Торг прошёл удачно. Ты сохранил часть денег."; }else response="Собеседник не уступил. Иногда цена уже минимальная."}else if(/провер|imei|документ|чек/.test(v)){state.skills["Осторожность"]=Math.min(5,state.skills["Осторожность"]+1);response="Ты настаиваешь на проверке и документах. Это снижает риск неприятных сюрпризов.";state.risk=Math.max(0,state.risk-1)}else if(/ремонт|почин/.test(v)){if(state.energy>=3){state.energy-=3;state.skills["Ремонт"]=Math.min(5,state.skills["Ремонт"]+1);response="Ты уделяешь время диагностике и ремонту. Навык растёт."}else response="На сегодня сил уже маловато."}else if(/угрож|обман|кинуть/.test(v))response="Ты не собираешься участвовать в сомнительной истории. Вежливо заканчиваешь разговор.";else if(/спать|отдых/.test(v)){sleep();return}else if(/куп|телефон|товар/.test(v)){buyPhone();return}else if(/прод/.test(v)){sellPhone();return}else if(/ген|сан|рустам/.test(v))response="Ты вспоминаешь, что отношения с людьми - тоже часть бизнеса.";state.lastLine=response;state.lastNPC="none";$("customAction").value="";render()}

function settings(){openModal("Настройки",`<div class="row"><button onclick="toggleTheme()">Сменить тему</button><button class="secondary" onclick="soundOn=!soundOn;this.textContent=soundOn?'Звук включён':'Звук выключен'">${soundOn?"Звук включён":"Звук выключен"}</button></div><p>Автосохранение: ${(()=>{try{return localStorage.getItem("perekup_save")?"активно":"ожидает первого сохранения"}catch(e){return"недоступно в этом браузере"}})()}</p><button class="secondary" onclick="loadCode()">Загрузить код сохранения</button><button class="secondary" onclick="saveCode()">Показать код сохранения</button>`)}
function toggleTheme(){let d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark"}
function gallery(){openModal("Галерея концовок",ENDINGS.map(e=>`<div class="item"><span>${state.gallery.includes(e.id)?"🏆":"🔒"}</span><b>${state.gallery.includes(e.id)?e.name:"Неизвестная концовка"}</b></div>`).join(""))}
window.addEventListener("beforeunload",saveAuto);
loadAuto();render();
</script>
</body></html>
